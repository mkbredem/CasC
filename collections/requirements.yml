---
# Installed by AAP each time the project syncs.
# ansible.* collections come from Automation Hub (certified, supported).
# infra.* collections come from Automation Hub validated content or Ansible
# Galaxy (Red Hat Communities of Practice, no support entitlement).
# Use the collection versions released for AAP 2.7; older ansible.* versions
# can target component APIs that 2.7 no longer serves.
collections:
  - name: ansible.platform
  - name: ansible.controller
  - name: ansible.hub
  - name: ansible.eda
  - name: infra.aap_configuration
  - name: infra.aap_configuration_extended
...
